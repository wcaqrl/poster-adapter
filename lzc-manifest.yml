application:
  subdomain: poster
  multi_instance: false
  routes:
    - /=http://poster:80/
services:
  poster:
    # 监控流程会在构建 LPK 前将该地址替换为 copy-image 返回的官方镜像地址。
    # upstream: ghcr.io/wcaqrl/poster:0.1.3@sha256:3fd61e606ef8b6b200ba38e6d54cf148400c4579827e23ad1d7b346cac800744
    image: registry.lazycat.cloud/peter/wcaqrl/poster:a2dabb1901c05cdf
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
